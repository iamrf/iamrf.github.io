name: Deploy Ubuntu

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-ubuntu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ubuntu-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack release
        run: |
          tar -czf portfolio-release.tar.gz -C dist .
          ls -lh portfolio-release.tar.gz

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.UBUNTU_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.UBUNTU_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.UBUNTU_HOST }}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload & activate release
        env:
          HOST: ${{ secrets.UBUNTU_HOST }}
          USER: ${{ secrets.UBUNTU_USER }}
          PORT: ${{ secrets.UBUNTU_SSH_PORT }}
          APP_DIR: ${{ secrets.UBUNTU_APP_DIR }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          APP_DIR="${APP_DIR:-/var/www/portfolio}"
          REMOTE="${USER}@${HOST}"
          SSH=(ssh -p "$PORT" -o StrictHostKeyChecking=yes "$REMOTE")
          SCP=(scp -P "$PORT" -o StrictHostKeyChecking=yes)

          "${SCP[@]}" portfolio-release.tar.gz "$REMOTE:/tmp/portfolio-release.tar.gz"
          "${SCP[@]}" deploy/ubuntu/remote-activate.sh "$REMOTE:/tmp/portfolio-remote-activate.sh"

          "${SSH[@]}" "chmod +x /tmp/portfolio-remote-activate.sh && \
            APP_DIR='$APP_DIR' \
            RELEASE_SHA='${{ github.sha }}' \
            /tmp/portfolio-remote-activate.sh"

      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.UBUNTU_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "UBUNTU_HEALTH_URL not set — skipping health check"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS -o /dev/null -w "%{http_code}" "$HEALTH_URL" | grep -qE '200|301|302'; then
              echo "Health check OK: $HEALTH_URL"
              exit 0
            fi
            echo "Attempt $i failed — retrying in 5s"
            sleep 5
          done
          echo "Health check failed"
          exit 1

      - name: Summary
        run: |
          echo "### Ubuntu deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Host:** ${{ secrets.UBUNTU_HOST }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Health:** ${{ secrets.UBUNTU_HEALTH_URL }}" >> "$GITHUB_STEP_SUMMARY"
